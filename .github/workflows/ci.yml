name: CI

# Runs the four checks that were previously only ever run by hand.
# Nothing merges to main on trust alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # NOTE: this string is the required status check in main's branch
    # protection, which matches by name. Renaming it means the required check
    # never reports and every PR blocks permanently - and with enforce_admins
    # on, nobody can override it. Change the protection rule first, or leave
    # this alone. The heading check was added without renaming for exactly
    # this reason.
    name: Typecheck, contrast, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Contrast is a real gate, not a report: scripts/contrast.mjs exits
      # non-zero if any pairing drops below its WCAG 2.2 AA threshold, in
      # either theme. The handoff requires re-verification whenever a colour
      # changes, and this is what enforces it.
      - name: Contrast audit
        run: npm run contrast

      # Every route must expose exactly one <h1>. Screens that build their own
      # header instead of using DarkHeader can quietly render the title as a
      # plain div - that is how the codex hub ended up with none (§14).
      # scripts/h1-check.tsx renders all 86 routes through react-dom/server and
      # exits non-zero on any route with zero or more than one. No browser
      # needed, so it costs seconds rather than a Chromium download.
      # Comparative nutrition claims are written on different screens by
      # different passes of work, and nothing checked that two claims about
      # the same food and nutrient agreed. One pair did not: baobab was
      # "Six times the vitamin C of oranges" on one screen and "around 10x"
      # on another. scripts/claims.mjs keys every multiplier claim by
      # (subject, nutrient, comparator) and exits non-zero on a disagreement.
      # content.ts is verbatim, so a contradiction already in it is carried on
      # an explicit ACKNOWLEDGED list that must name the depth note explaining
      # it - and a stale acknowledgement fails too, so the list is a ratchet.
      - name: Claim consistency
        run: npm run claims

      - name: Heading check
        run: npm run h1

      # A menu dish declares one allergen in a single `has` string, so a dish
      # with two declared the first and stayed silent about the second. The
      # co-op tofu spent its `has` on soy while its own description read
      # "sesame oil", and a sesame-free profile was told it fits. This gate
      # compares the allergens a dish NAMES against what it declares, and
      # fails on a stale over-declaration too.
      - name: Allergen declarations
        run: npm run allergens

      # PhotoHeader paints 47 different per-item colour pairs from
      # content.ts as the ground behind a lazy image. No other pass can see
      # them: they are not tokens, they are built at runtime from data, and
      # a gradient has no single colour for a DOM audit to read. The
      # Illustration mark sits where the scrim is thinnest.
      - name: Header legibility
        run: npm run headers

      - name: Build
        run: npm run build
