<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rooted Strength</title>
    <meta
      name="description"
      content="Plant-based strength, ancestral food and land-based fitness — with every claim graded by the evidence behind it."
    />

    <!--
      theme-color is the status bar behind the app once it is installed. It is
      --forest, which is what DarkHeader already paints, so the bar and the
      header meet without a seam.
    -->
    <meta name="theme-color" content="#1E3A2B" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest and will not take an SVG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rooted" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
